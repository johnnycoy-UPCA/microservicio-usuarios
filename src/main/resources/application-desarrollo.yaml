spring:
  datasource:
    url: jdbc:h2:file:./datos/usuarios;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # properties:
    #   hibernate:
    #     format_sql: true
    properties:
      "[hibernate.format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

seguridad:
  jwt:
    secreto: ${JWT_SECRETO}
    duracion-milisegundos: ${JWT_DURACION_MILISEGUNDOS:3600000}